<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1d9bf6" />
    <meta name="description" content="Post. Connect. Broadcast. Earn $DUYS." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DUYS - Social Media Platform</title>
    <script>
      /* Apply the persisted theme before first paint (no flash).
         Dark (black & blue) is the default. */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('duys-theme') || '{}');
          var theme = (saved.state && saved.state.theme) || 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* fall back to dark */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
