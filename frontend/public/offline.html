<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUYS — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #000; color: #e7e9ea; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .card { text-align: center; padding: 40px 32px; border: 1px solid #2f3336; border-radius: 24px; background: #16181c; box-shadow: 0 24px 64px rgba(0,0,0,0.4); max-width: 360px; }
      .logo { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, #1d9bf6, #0d8fed); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 34px; font-weight: 900; color: #fff; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #1d9bf6; }
      p { margin:: 0 bolt 22px; font-size: 14px; color: #71767b; }
      a { display: inline-block; margin-top: 8px; padding: 9px 20px; border-radius: 999px; background: #1d9bf6; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">D</div>
      <h1>You're offline</h1>
      <p>Check your connection and try again. You can still browse pages you've visited recently.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
